<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Animations</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030308;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Helper functions
    const random = (min, max) => Math.random() * (max - min) + min;
    const randomInt = (min, max) => Math.floor(random(min, max + 1));
    const randomColor = () => `hsl(${random(0, 360)}, 85%, 60%)`;

    // Global state
    let currentMode = 0;
    let modeTimer = 0;
    const MODE_DURATION = 500; // frames per animation switch (~8 seconds)
    let state = {};

    // --- ANIMATION 1: Neon Particle Constellation ---
    function initConstellation() {
      const count = 120;
      const particles = [];
      for (let i = 0; i < count; i++) {
        particles.push({
          x: random(0, width),
          y: random(0, height),
          vx: random(-1.5, 1.5),
          vy: random(-1.5, 1.5),
          radius: random(1.5, 3),
          color: `hsl(${random(180, 280)}, 90%, 65%)`
        });
      }
      return { particles };
    }

    function drawConstellation(data) {
      ctx.fillStyle = 'rgba(3, 3, 8, 0.25)';
      ctx.fillRect(0, 0, width, height);

      const p = data.particles;
      for (let i = 0; i < p.length; i++) {
        p[i].x += p[i].vx;
        p[i].y += p[i].vy;

        if (p[i].x < 0 || p[i].x > width) p[i].vx *= -1;
        if (p[i].y < 0 || p[i].y > height) p[i].vy *= -1;

        ctx.beginPath();
        ctx.arc(p[i].x, p[i].y, p[i].radius, 0, Math.PI * 2);
        ctx.fillStyle = p[i].color;
        ctx.fill();

        for (let j = i + 1; j < p.length; j++) {
          const dx = p[i].x - p[j].x;
          const dy = p[i].y - p[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 130) {
            ctx.beginPath();
            ctx.moveTo(p[i].x, p[i].y);
            ctx.lineTo(p[j].x, p[j].y);
            ctx.strokeStyle = `rgba(120, 180, 255, ${1 - dist / 130})`;
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }
        }
      }
    }

    // --- ANIMATION 2: Hypnotic Vortex Tunnel ---
    function initVortex() {
      return { angle: 0, hue: 0 };
    }

    function drawVortex(data) {
      ctx.fillStyle = 'rgba(3, 3, 8, 0.08)';
      ctx.fillRect(0, 0, width, height);

      data.angle += 0.03;
      data.hue = (data.hue + 0.8) % 360;

      const centerX = width / 2;
      const centerY = height / 2;
      const numRings = 25;

      ctx.save();
      ctx.translate(centerX, centerY);

      for (let i = 0; i < numRings; i++) {
        const radius = (i * 18 + (data.angle * 20)) % (Math.max(width, height) * 0.7);
        const currentAngle = data.angle + (i * 0.15);
        
        ctx.save();
        ctx.rotate(currentAngle);
        ctx.beginPath();
        
        const sides = 5 + (i % 3);
        for (let s = 0; s < sides; s++) {
          const a = (s * 2 * Math.PI) / sides;
          const x = Math.cos(a) * radius;
          const y = Math.sin(a) * radius;
          if (s === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();

        ctx.strokeStyle = `hsl(${(data.hue + i * 10) % 360}, 90%, 60%)`;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      ctx.restore();
    }

    // --- ANIMATION 3: Cyber Firefly Flow ---
    function initFireflies() {
      const count = 150;
      const flies = [];
      for (let i = 0; i < count; i++) {
        flies.push({
          x: random(0, width),
          y: random(0, height),
          angle: random(0, Math.PI * 2),
          speed: random(1.5, 3.5),
          hue: random(0, 360),
          size: random(2, 4)
        });
      }
      return { flies };
    }

    function drawFireflies(data) {
      ctx.fillStyle = 'rgba(3, 3, 8, 0.12)';
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = 'lighter';

      data.flies.forEach(f => {
        f.angle += random(-0.2, 0.2);
        f.x += Math.cos(f.angle) * f.speed;
        f.y += Math.sin(f.angle) * f.speed;

        if (f.x < 0) f.x = width;
        if (f.x > width) f.x = 0;
        if (f.y < 0) f.y = height;
        if (f.y > height) f.y = 0;

        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${f.hue}, 100%, 70%)`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = `hsl(${f.hue}, 100%, 50%)`;
        ctx.fill();
      });

      ctx.globalCompositeOperation = 'source-over';
      ctx.shadowBlur = 0;
    }

    // --- ANIMATION 4: Pulsing Digital Wave Matrix ---
    function initWaveMatrix() {
      return { step: 0 };
    }

    function drawWaveMatrix(data) {
      ctx.fillStyle = 'rgba(3, 3, 8, 0.2)';
      ctx.fillRect(0, 0, width, height);

      data.step += 0.04;

      const cols = 35;
      const rows = 20;
      const xSpacing = width / cols;
      const ySpacing = height / rows;

      for (let x = 0; x < cols; x++) {
        for (let y = 0; y < rows; y++) {
          const dist = Math.sin(x * 0.3 + data.step) + Math.cos(y * 0.3 + data.step);
          const radius = Math.max(1, (dist + 2) * 3);
          const hue = ((x * 10 + y * 10) + data.step * 50) % 360;

          const posX = x * xSpacing + xSpacing / 2;
          const posY = y * ySpacing + ySpacing / 2;

          ctx.beginPath();
          ctx.arc(posX, posY, radius, 0, Math.PI * 2);
          ctx.fillStyle = `hsl(${hue}, 85%, 60%)`;
          ctx.fill();
        }
      }
    }

    // Modes Registry
    const modes = [
      { init: initConstellation, draw: drawConstellation },
      { init: initVortex, draw: drawVortex },
      { init: initFireflies, draw: drawFireflies },
      { init: initWaveMatrix, draw: drawWaveMatrix }
    ];

    function switchMode() {
      let nextMode;
      do {
        nextMode = randomInt(0, modes.length - 1);
      } while (nextMode === currentMode && modes.length > 1);

      currentMode = nextMode;
      state = modes[currentMode].init();
      modeTimer = 0;

      // Clear stage on switch
      ctx.fillStyle = '#030308';
      ctx.fillRect(0, 0, width, height);
    }

    // Boot initial mode
    switchMode();

    // Loop
    function loop() {
      modes[currentMode].draw(state);
      modeTimer++;

      if (modeTimer >= MODE_DURATION) {
        switchMode();
      }

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
